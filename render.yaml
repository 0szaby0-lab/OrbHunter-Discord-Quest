services:
  - type: web
    name: orbhunter-discord-quest
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OWNER_ID
        sync: false
